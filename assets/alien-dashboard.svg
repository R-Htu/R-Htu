<svg width="900" height="640" viewBox="0 0 900 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="640" rx="18" fill="#070a12"/>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101827"/>
      <stop offset="1" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="acid" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8bff5a"/>
      <stop offset="0.45" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="wormhole" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8bff5a" stop-opacity="0.34"/>
      <stop offset="0.48" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#070a12" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#7dd3fc" stroke-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="640" fill="url(#grid)"/>
  <circle cx="450" cy="310" r="250" fill="url(#wormhole)"/>
  <rect x="24" y="24" width="852" height="592" rx="16" stroke="#334155" stroke-width="2"/>
  <path d="M44 86H856" stroke="url(#acid)" stroke-width="2"/>

  <text x="46" y="60" fill="#e5f7ff" font-family="Consolas, monospace" font-size="20" font-weight="700">R-Htu // Interdimensional Build Console</text>
  <text x="590" y="60" fill="#8bff5a" font-family="Consolas, monospace" font-size="15">SIGNAL: VERY SUSPICIOUS</text>

  <g transform="translate(52 116)">
    <rect width="338" height="176" rx="14" fill="url(#panel)" stroke="#263244"/>
    <text x="24" y="42" fill="#8bff5a" font-family="Segoe UI, Arial" font-size="24" font-weight="700">Mission Status</text>
    <text x="24" y="84" fill="#cbd5e1" font-family="Consolas, monospace" font-size="18">coffee_fuel: 97%</text>
    <text x="24" y="118" fill="#cbd5e1" font-family="Consolas, monospace" font-size="18">bugs_detected: probably</text>
    <text x="24" y="152" fill="#cbd5e1" font-family="Consolas, monospace" font-size="18">deploy_mood: brave</text>
  </g>

  <g transform="translate(510 116)">
    <rect width="338" height="176" rx="14" fill="url(#panel)" stroke="#263244"/>
    <text x="24" y="42" fill="#22d3ee" font-family="Segoe UI, Arial" font-size="24" font-weight="700">Dimensional Stack</text>
    <text x="24" y="84" fill="#cbd5e1" font-family="Consolas, monospace" font-size="18">React Native // mobile portal</text>
    <text x="24" y="118" fill="#cbd5e1" font-family="Consolas, monospace" font-size="18">Next.js      // web ship</text>
    <text x="24" y="152" fill="#cbd5e1" font-family="Consolas, monospace" font-size="18">Firebase     // data nebula</text>
  </g>

  <g transform="translate(310 196)" filter="url(#glow)">
    <ellipse cx="140" cy="114" rx="88" ry="108" fill="#111827" stroke="url(#acid)" stroke-width="4"/>
    <ellipse cx="107" cy="108" rx="22" ry="32" fill="#8bff5a"/>
    <ellipse cx="173" cy="108" rx="22" ry="32" fill="#8bff5a"/>
    <circle cx="114" cy="108" r="7" fill="#020617"/>
    <circle cx="166" cy="108" r="7" fill="#020617"/>
    <path d="M108 168C128 184 152 184 172 168" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
    <path d="M62 62C24 20 34 0 92 38" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
    <path d="M218 62C256 20 246 0 188 38" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(52 382)">
    <text x="0" y="0" fill="#f472b6" font-family="Segoe UI, Arial" font-size="23" font-weight="700">Alien Language Mix</text>
    <rect x="0" y="30" width="370" height="20" rx="10" fill="#1f2937"/>
    <rect x="0" y="30" width="122" height="20" rx="10" fill="#22d3ee"/>
    <rect x="122" y="30" width="96" height="20" fill="#8bff5a"/>
    <rect x="218" y="30" width="70" height="20" fill="#f97316"/>
    <rect x="288" y="30" width="54" height="20" fill="#a78bfa"/>
    <rect x="342" y="30" width="28" height="20" rx="10" fill="#f472b6"/>
    <text x="0" y="84" fill="#cbd5e1" font-family="Consolas, monospace" font-size="17">JS/TS 33%  React 26%  Firebase 19%</text>
    <text x="0" y="112" fill="#cbd5e1" font-family="Consolas, monospace" font-size="17">CSS 15%  Mystery 7%</text>
  </g>

  <g transform="translate(492 382)">
    <text x="0" y="0" fill="#8bff5a" font-family="Segoe UI, Arial" font-size="23" font-weight="700">Contribution Wormhole</text>
    <path d="M0 118C30 36 64 86 96 58C128 30 160 128 194 80C228 34 262 54 294 44C326 34 358 96 400 42"
          stroke="url(#acid)" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 118H408" stroke="#334155" stroke-width="2"/>
    <path d="M0 118V26" stroke="#334155" stroke-width="2"/>
    <g fill="#22d3ee">
      <circle cx="0" cy="118" r="5"/>
      <circle cx="96" cy="58" r="5"/>
      <circle cx="194" cy="80" r="5"/>
      <circle cx="294" cy="44" r="5"/>
      <circle cx="400" cy="42" r="5"/>
    </g>
    <text x="0" y="154" fill="#94a3b8" font-family="Consolas, monospace" font-size="15">warning: graph may include</text>
    <text x="0" y="180" fill="#94a3b8" font-family="Consolas, monospace" font-size="15">parallel-universe commits</text>
  </g>
</svg>
