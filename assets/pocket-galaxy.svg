<svg width="900" height="420" viewBox="0 0 900 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="420" rx="18" fill="#050711"/>
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff7ad" stop-opacity="0.95"/>
      <stop offset="0.16" stop-color="#ff7ad9" stop-opacity="0.72"/>
      <stop offset="0.42" stop-color="#6ee7ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#050711" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.44" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="starfield" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="14" r="1.4" fill="#dbeafe" opacity="0.45"/>
      <circle cx="62" cy="24" r="1" fill="#fef3c7" opacity="0.35"/>
      <circle cx="38" cy="70" r="1.2" fill="#bfdbfe" opacity="0.42"/>
      <circle cx="82" cy="78" r="0.9" fill="#fbcfe8" opacity="0.36"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: Consolas, Monaco, monospace; }
    .ui { font-family: Segoe UI, Arial, sans-serif; }
    .spinSlow { animation: spin 18s linear infinite; transform-origin: 450px 210px; }
    .spinFast { animation: spin 10s linear infinite reverse; transform-origin: 450px 210px; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
    .twinkle { animation: twinkle 1.6s ease-in-out infinite; }
    .drift { animation: drift 4.8s ease-in-out infinite; }
    .dash { stroke-dasharray: 20 14; animation: dash 7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .82; } 50% { transform: scale(1.08); opacity: 1; } }
    @keyframes twinkle { 0%,100% { opacity: .28; } 50% { opacity: 1; } }
    @keyframes drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes dash { to { stroke-dashoffset: -220; } }
  </style>

  <rect width="900" height="420" fill="url(#starfield)"/>
  <circle class="pulse" cx="450" cy="210" r="160" fill="url(#core)"/>

  <g class="spinSlow">
    <ellipse cx="450" cy="210" rx="276" ry="74" stroke="url(#ring)" stroke-width="3" opacity="0.75"/>
    <ellipse cx="450" cy="210" rx="222" ry="48" stroke="#60a5fa" stroke-width="2" opacity="0.36"/>
    <circle cx="724" cy="210" r="7" fill="#a3e635" filter="url(#glow)"/>
    <circle cx="242" cy="210" r="5" fill="#f472b6" filter="url(#glow)"/>
  </g>

  <g class="spinFast">
    <ellipse cx="450" cy="210" rx="118" ry="218" stroke="#22d3ee" stroke-width="2.4" opacity="0.55"/>
    <ellipse cx="450" cy="210" rx="84" ry="170" stroke="#f97316" stroke-width="2" opacity="0.36"/>
    <circle cx="450" cy="42" r="6" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="450" cy="374" r="5" fill="#f97316" filter="url(#glow)"/>
  </g>

  <g filter="url(#glow)">
    <circle class="pulse" cx="450" cy="210" r="32" fill="#fff7ad"/>
    <circle cx="450" cy="210" r="18" fill="#050711"/>
    <circle cx="450" cy="210" r="8" fill="#ff7ad9"/>
  </g>

  <path class="dash" d="M86 88H246L270 60L294 92L324 88H814" stroke="#22d3ee" stroke-width="2" opacity="0.52"/>
  <path class="dash" d="M86 334H198L224 304L252 346L282 334H814" stroke="#f472b6" stroke-width="2" opacity="0.52"/>

  <g class="mono" font-size="18">
    <text x="64" y="58" fill="#a3e635">GALAXY.exe</text>
    <text x="64" y="82" fill="#94a3b8">bug gravity: high</text>
    <text x="64" y="106" fill="#94a3b8">coffee orbit: stable</text>
    <text x="660" y="58" fill="#22d3ee">SHIP MODE</text>
    <text x="660" y="82" fill="#94a3b8">confidence: suspicious</text>
    <text x="660" y="106" fill="#94a3b8">rollback plan: vibes</text>
  </g>

  <g class="ui" text-anchor="middle">
    <text x="450" y="202" fill="#f8fafc" font-size="30" font-weight="800">Pocket Galaxy</text>
    <text x="450" y="238" fill="#cbd5e1" font-size="18" font-weight="700">tiny universe // loud keyboard // brave deploy</text>
  </g>

  <g class="twinkle" fill="#e0f2fe">
    <circle cx="158" cy="166" r="2.5"/>
    <circle cx="780" cy="160" r="2.3"/>
    <circle cx="208" cy="292" r="2.2"/>
    <circle cx="706" cy="298" r="2.6"/>
  </g>

  <g class="drift" opacity="0.9">
    <text x="326" y="142" fill="#f472b6" class="mono" font-size="16">TODO: sleep</text>
    <text x="512" y="292" fill="#a3e635" class="mono" font-size="16">404: fear not found</text>
  </g>
</svg>
